services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Tal3054910!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-LusManager}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-Tal3054910!}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: lus-api:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      PORT: "8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-LusManager};User=root;Password=${MYSQL_ROOT_PASSWORD:-Tal3054910!};SslMode=None;AllowPublicKeyRetrieval=true;"
      Auth__Cookie__Domain: ""
      Auth__Cookie__Secure: "false"
      Cors__Origins: "http://localhost:4200,http://localhost:8080"
      Caching__ProviderName: "${CACHING_PROVIDER:-redis}"
      Redis__Host: "${REDIS_HOST:-redis}"
      Redis__Port: "${REDIS_PORT:-6379}"
      Redis__Username: "${REDIS_USERNAME:-}"
      Redis__Password: "${REDIS_PASSWORD:-}"
      Redis__Ssl: "${REDIS_SSL:-false}"
      PythonSetting__PythonProviderPath: /usr/bin/python
      PythonSetting__PythonScriptFolder: /app/PythonScripts
    ports:
      - "8080:8080"

  ui:
    build:
      context: ./Lus.UI
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: ${UI_BUILD_CONFIGURATION:-development}
    image: lus-ui:local
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  db_data:
